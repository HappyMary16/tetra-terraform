apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetra-deployment
spec:
  selector:
    matchLabels:
      app: tetra-facade
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
        app: tetra-facade
    spec:
      serviceAccountName: tetra-sa
      containers:
        - name: tetra-facade
          imagePullPolicy: Always
          image: ghcr.io/happymary16/tetra:latest
          args:
            - tetra-facade
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
          env:
           - name: CGM_FILE_SYSTEM
             value: azure
           - name: CGM_MODE
             value: parallel
      imagePullSecrets:
        - name: github-secret
