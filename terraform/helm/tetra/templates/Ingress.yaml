apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tetra-ingress
  annotations:
    cert-manager.io/issuer: letsencrypt
    # Model input files are large, NGINX allows only 1m by default.
    # Keep in sync with spring.servlet.multipart.max-request-size in tetra-facade.
    nginx.ingress.kubernetes.io/proxy-body-size: "300m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - "{{ .Values.tetra.clusterDomain }}"
      secretName: tetra-certificate-secret
  rules:
    - host: "{{ .Values.tetra.clusterDomain }}"
      http:
        paths:
          - backend:
              service:
                name: tetra-facade-service
                port:
                  number: 80
            path: /
            pathType: Prefix
